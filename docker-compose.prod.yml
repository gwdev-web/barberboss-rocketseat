# Sobe a imagem de produção com MySQL. Diferenças em relação ao docker-compose.yml:
# ambiente Production, portas do banco não publicadas no host, senhas obrigatórias
# (sem defaults) e healthcheck ligado ao endpoint /health/ready da API.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.0
    container_name: barberboss-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-barberboss}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
    # Sem `ports`: o banco fica acessível apenas pela rede interna do compose.
    volumes:
      - barberboss-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - barberboss

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    image: ${IMAGE_NAME:-barberboss-api}:${IMAGE_TAG:-latest}
    container_name: barberboss-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Connection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-barberboss};Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};"
      Settings__Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY}
      Settings__Jwt__ExpirationTimeMinutes: ${JWT_EXPIRATION_MINUTES:-60}
      Settings__Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # Em produção aponte para o domínio real; só afeta o log de inicialização.
      Settings__PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - barberboss

volumes:
  barberboss-mysql-data:

networks:
  barberboss:
    driver: bridge
